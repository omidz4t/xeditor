<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="All XEditor release downloads — app.xdc, editor-full.xdc, editor-lite.xdc."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>XEditor — Versions</title>
    <link rel="icon" href="./app/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./app/icon.png" />
    <link rel="stylesheet" href="./editor-fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="xeditor-type versions-page">
    <div class="page page--versions">
      <header class="ver-top">
        <a class="ver-back" href="./">
          <svg
            class="ver-back__icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <!-- Heroicons outline: arrow-left -->
            <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
          </svg>
          Home
        </a>
        <a class="ver-webapp" href="./app/">Open webapp</a>
      </header>

      <main class="ver-main">
        <h1 class="ver-title">Versions</h1>
        <p class="ver-lead">
          All published releases.
          <span class="ver-lead__meta">Latest <strong>v__XEDITOR_VERSION__</strong> ·
          <a href="https://github.com/__XEDITOR_REPO__/releases" target="_blank" rel="noopener">GitHub</a></span>
        </p>

        <div id="versions-root">
          <!-- __XEDITOR_VERSIONS_TABLE__ -->
        </div>

        <p class="ver-foot">
          Packages: <code>app.xdc</code> (default),
          <code>editor-full.xdc</code>, <code>editor-lite.xdc</code>.
          Hosted on GitHub Releases.
        </p>
      </main>
    </div>
    <script src="./versions.js" defer></script>
  </body>
</html>
