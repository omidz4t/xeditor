# On every push to main (except automated release commits):
#   1. Bump version (patch) + commit + tag + push
#   2. Build editor (WebXDC) + Pages site (landing is NOT in .xdc)
#   3. Publish .xdc files to GitHub Releases
#   4. Deploy GitHub Pages
#
# Only `main`.
#
# Settings:
#   · Pages → Source: GitHub Actions
#   · Actions → General → Workflow permissions → Read and write

name: Main release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Version · build · release · pages
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          # Bot identity only — no GPG/SSH signing keys in CI (unsigned release commits).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config tag.gpgsign false

      - name: Bump version (patch) · commit · tag
        id: version
        run: |
          node scripts/bump-version.mjs --force patch --tag --skip-ci
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release"
            echo "- **version:** \`${VERSION}\`"
            echo "- **trigger sha:** \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build WebXDC + Pages site
        run: npm run build:pages

      - name: Verify outputs
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/styles.css
          test -f dist-pages/app/index.html
          test -f dist-xdc/app.xdc
          test -f dist-xdc/editor-full.xdc
          test -f dist-xdc/editor-lite.xdc
          # Marketing must not be inside the WebXDC package / editor dist
          if unzip -l dist-xdc/app.xdc | grep -E 'site/|Marketing landing'; then
            echo "Marketing paths leaked into .xdc" >&2
            exit 1
          fi
          if grep -q 'How it works' dist/index.html; then
            echo "Landing page must not replace editor dist/index.html" >&2
            exit 1
          fi
          grep -q 'How it works' dist-pages/index.html
          grep -q 'Collaborative block editor' dist-pages/index.html
          echo "OK v${{ steps.version.outputs.version }}"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webxdc-v${{ steps.version.outputs.version }}
          path: dist-xdc/*.xdc
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XEditor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist-xdc/app.xdc
            dist-xdc/editor-full.xdc
            dist-xdc/editor-lite.xdc
          body: |
            ## XEditor v${{ steps.version.outputs.version }}

            Collaborative block editor for Delta Chat (WebXDC).

            ### Packages
            | File | Notes |
            |------|--------|
            | `app.xdc` | Default (full fonts) |
            | `editor-full.xdc` | All Shabnam + Arad weights |
            | `editor-lite.xdc` | Regular + Bold only (smaller) |

            ### Demo
            GitHub Pages: marketing site + browser demo under `/app/`  
            (marketing is **not** included in the `.xdc` files.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
