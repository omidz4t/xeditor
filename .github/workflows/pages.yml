# On every push to main (except automated release commits):
#   1. Bump version (patch) + commit + tag + push  (bot, unsigned — no keys in CI)
#   2. Build editor (WebXDC) + initial Pages site
#   3. Capture product screenshots (Puppeteer against local dist-pages)
#      → written only under dist/screenshots (NOT committed to git)
#   4. Rebuild Pages so dist-pages/ includes those shots
#   5. Publish .xdc files to GitHub Releases
#   6. Deploy dist-pages to the `gh-pages` branch
#
# Only `main`.
#
# Required once (repo Settings → Pages):
#   Source: Deploy from a branch
#   Branch: gh-pages / (root)
#
# Also: Actions → General → Workflow permissions → Read and write
#
# Never put GPG/PGP private keys in Actions secrets for this workflow.

name: Main release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Version · screenshots · build · release · pages
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          # Version-bump commits only. Never sign in CI — signing keys stay on local machines.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config tag.gpgsign false

      - name: Bump version (patch) · commit · tag
        id: version
        run: |
          node scripts/bump-version.mjs --force patch --tag --skip-ci
          VERSION=$(node -p "require('./package.json').version")
          REPO="${GITHUB_REPOSITORY}"
          TAG="v${VERSION}"
          BASE="https://github.com/${REPO}/releases"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_url=${BASE}/tag/${TAG}" >> "$GITHUB_OUTPUT"
          echo "app_url=${BASE}/download/${TAG}/app.xdc" >> "$GITHUB_OUTPUT"
          echo "full_url=${BASE}/download/${TAG}/editor-full.xdc" >> "$GITHUB_OUTPUT"
          echo "lite_url=${BASE}/download/${TAG}/editor-lite.xdc" >> "$GITHUB_OUTPUT"
          {
            echo "### Release v${VERSION}"
            echo ""
            echo "| | Link |"
            echo "|--|--|"
            echo "| **Version** | \`${VERSION}\` (\`${TAG}\`) |"
            echo "| **Release** | ${BASE}/tag/${TAG} |"
            echo "| **app.xdc** | ${BASE}/download/${TAG}/app.xdc |"
            echo "| **editor-full.xdc** | ${BASE}/download/${TAG}/editor-full.xdc |"
            echo "| **editor-lite.xdc** | ${BASE}/download/${TAG}/editor-lite.xdc |"
            echo "| **Site** | https://omidz4t.github.io/xeditor/ |"
            echo "| **Demo** | https://omidz4t.github.io/xeditor/app/ |"
            echo "| **Versions page** | https://omidz4t.github.io/xeditor/versions.html |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build editor + initial Pages site
        env:
          XEDITOR_VERSION: ${{ steps.version.outputs.version }}
          XEDITOR_REPO: ${{ github.repository }}
        run: npm run build:pages

      - name: Install Chromium (Puppeteer)
        run: npx puppeteer browsers install chrome

      - name: Capture product screenshots
        env:
          BASE_URL: http://127.0.0.1:4173
          APP_PATH: /app/
          # CI-only path (gitignored via dist/) — never committed
          OUT_DIR: dist/screenshots
          TARGET_KB: '100'
          MIN_QUALITY: '80'
          DEVICE_SCALE: '2'
        run: |
          set -euo pipefail
          npx --yes serve dist-pages -p 4173 --no-clipboard > /tmp/serve-pages.log 2>&1 &
          SERVE_PID=$!
          cleanup() { kill "$SERVE_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "Waiting for dist-pages on :4173…"
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/" >/dev/null 2>&1; then
              echo "Server ready (${i}s)"
              break
            fi
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "serve exited early:" >&2
              cat /tmp/serve-pages.log >&2 || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for serve" >&2
              cat /tmp/serve-pages.log >&2 || true
              exit 1
            fi
          done

          node scripts/screenshot-app.mjs

          test -f dist/screenshots/app-editor.jpg
          test -f dist/screenshots/app-sidebar.jpg
          test -f dist/screenshots/manifest.json
          ls -la dist/screenshots/*.jpg | head -40

      - name: Rebuild Pages with fresh screenshots
        env:
          XEDITOR_VERSION: ${{ steps.version.outputs.version }}
          XEDITOR_REPO: ${{ github.repository }}
        run: node scripts/build-pages.mjs

      - name: Verify outputs
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/styles.css
          test -f dist-pages/versions.html
          test -f dist-pages/versions.json
          test -f dist-pages/app/index.html
          test -f dist-pages/app/webxdc.js
          grep -q 'IndexedDB' dist-pages/app/webxdc.js
          # dist/webxdc.js is the vite-preview mock (written by package-font-variants).
          # It must not ship inside .xdc — checked via unzip below.
          grep -q "v${{ steps.version.outputs.version }}" dist-pages/index.html
          grep -q "v${{ steps.version.outputs.version }}" dist-pages/versions.html
          grep -q "releases/download/v${{ steps.version.outputs.version }}/app.xdc" dist-pages/index.html
          ! grep -q '__XEDITOR_VERSION__' dist-pages/index.html
          # Screenshots ship only in the deployed site (not as a main-branch commit)
          test -f dist-pages/screenshots/app-editor.jpg
          test -f dist-pages/screenshots/app-sidebar.jpg
          test -f dist-pages/screenshots/app-comments.jpg
          test -f dist-xdc/app.xdc
          test -f dist-xdc/editor-full.xdc
          test -f dist-xdc/editor-lite.xdc
          leak=$(unzip -l dist-xdc/app.xdc | grep -E 'site/|Marketing landing|webxdc-mock|Browser demo mock' || true)
          if [ -n "$leak" ]; then
            echo "Marketing/mock leaked into .xdc" >&2
            echo "$leak" >&2
            exit 1
          fi
          mockjs=$(unzip -l dist-xdc/app.xdc | grep -E '(^|/)webxdc\.js$' || true)
          if [ -n "$mockjs" ]; then
            echo "Mock webxdc.js must not be inside .xdc (host provides it)" >&2
            echo "$mockjs" >&2
            exit 1
          fi
          grep -qE 'XEditor|Write together' dist-pages/index.html
          if grep -qE 'Write together|What you get' dist/index.html; then
            echo "Landing page must not replace editor dist/index.html" >&2
            exit 1
          fi
          echo "OK v${{ steps.version.outputs.version }}"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webxdc-v${{ steps.version.outputs.version }}
          path: |
            dist-xdc/*.xdc
            dist-pages/versions.json
            dist/screenshots/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XEditor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist-xdc/app.xdc
            dist-xdc/editor-full.xdc
            dist-xdc/editor-lite.xdc
          body: |
            ## XEditor v${{ steps.version.outputs.version }}

            Collaborative block editor for Delta Chat (WebXDC).

            ### Downloads
            | Package | Link |
            |---------|------|
            | `app.xdc` (default) | ${{ steps.version.outputs.app_url }} |
            | `editor-full.xdc` | ${{ steps.version.outputs.full_url }} |
            | `editor-lite.xdc` | ${{ steps.version.outputs.lite_url }} |

            ### Site
            - Home: https://omidz4t.github.io/xeditor/
            - Demo: https://omidz4t.github.io/xeditor/app/
            - Versions: https://omidz4t.github.io/xeditor/versions.html
            - This release: ${{ steps.version.outputs.release_url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          enable_jekyll: false
          full_commit_message: 'deploy: pages v${{ steps.version.outputs.version }}'
