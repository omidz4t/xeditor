# On every push to main:
#   1. Bump version (patch) + commit + tag
#   2. Build editor + Pages site
#   3. Publish WebXDC artifacts
#   4. Deploy GitHub Pages
#
# Only `main`. No PR / other branch jobs.
#
# Repo settings:
#   Settings → Pages → Source: GitHub Actions
#   Actions need write permission to push the release commit/tag
#   (Settings → Actions → General → Workflow permissions → Read and write).

name: Main release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Version · build · publish · pages
    runs-on: ubuntu-latest
    # Ignore the bot release commit itself if [skip ci] was not honored.
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (patch) · commit · tag
        id: version
        run: |
          # Always patch-bump on main pushes; auto-commit includes [skip ci] in CI.
          node scripts/bump-version.mjs --force patch --tag --skip-ci
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- **version:** \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **sha:** \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build WebXDC + Pages site
        run: npm run build:pages

      - name: Verify outputs
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/app/index.html
          test -f dist-xdc/app.xdc
          echo "version=${{ steps.version.outputs.version }}"

      - name: Upload WebXDC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webxdc-v${{ steps.version.outputs.version }}
          path: dist-xdc/*.xdc
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
